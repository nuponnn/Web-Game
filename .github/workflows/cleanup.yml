name: Cleanup Cron

on:
  schedule:
    - cron: '*/15 * * * *'   # cleanupRooms ทุก 15 นาที
    - cron: '0 0 * * *'      # cleanupAuthUsers เที่ยงคืน UTC (7 โมงเช้าไทย)
  workflow_dispatch: # ให้รันมือได้

jobs:
  cleanup-rooms:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup stale rooms
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_URL }}/api/cleanupRooms" \
            -H "Content-Type: application/json" \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            -d '{}'

  cleanup-auth:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup anonymous auth users
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_URL }}/api/cleanupAuthUsers" \
            -H "Content-Type: application/json" \
            -H "X-CRON-SECRET: ${{ secrets.CRON_SECRET }}" \
            -d '{"cutoffSeconds": 86400}'
